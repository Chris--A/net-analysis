[workspace]
resolver = "3"
members = [
    "crates/na-model",
    "crates/na-platform",
    "crates/na-engine",
    "crates/na-cli",
    "crates/na-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
na-model = { path = "crates/na-model" }
na-platform = { path = "crates/na-platform" }
na-engine = { path = "crates/na-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
flume = "0.12"
clap = { version = "4", features = ["derive"] }

bevy = "0.20"
bevy_egui = "0.43"
bevy_panorbit_camera = { version = "0.36", features = ["bevy_egui"] }
# Must use the same egui as bevy_egui (0.43 → egui 0.36 → egui_plot 0.37).
egui_plot = "0.37"

# Bevy is very slow unoptimised; optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
